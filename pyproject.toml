[project]
name = "swg3"
version = "0.1.0"
description = "Tools for Pokémon FireRed and LeafGreen on Nintendo Switch: pk3 format and validation, box name codes, trade recipes"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["pokemon", "firered", "leafgreen", "gen3", "nintendo-switch", "pk3", "ace"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Private :: Do Not Upload",
]
license = "AGPL-3.0-or-later"
authors = [{ name = "Beater Studios", email = "studiosbeater@gmail.com" }]
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://swg3.beaterstudios.com"
Repository = "https://github.com/beater-studios/swg3"
Issues = "https://github.com/beater-studios/swg3/issues"

[project.scripts]
swg3 = "swg3.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]
tools = ["pillow==12.3.0"]

[tool.uv]
# Same policy as web/.npmrc: exact versions for new dependencies, and only releases at least 7 days old.
add-bounds = "exact"
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swg3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
