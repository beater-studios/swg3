name: Feature request
description: An idea for a new tool, guide or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The goal in the game, or the problem you run into today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: checkboxes
    id: paths
    attributes:
      label: How it would reach the game
      description: Every feature should offer every path that applies.
      options:
        - label: Typing in the game (box names, Mail or other fields)
        - label: ESP32 board over local wireless
        - label: Only lookup or calculation, nothing to send
